name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build.example.test
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_only
      APP_ORIGIN: https://assets.aliyasrealestate.ae
      ALIYAS_STANDALONE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
      - name: Verify the cPanel runtime package
        run: |
          pnpm exec node scripts/package-cpanel.mjs --verification
          pnpm exec node scripts/smoke-cpanel.mjs

  integration:
    name: Integration
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the disposable backend and scanner
        run: |
          mkdir -p .tools
          pnpm db:start > .tools/backend-start.log 2>&1
          docker compose -f compose.services.yaml -f compose.ci.yaml up -d
          pnpm exec node scripts/prepare-ci-env.mjs
          pnpm exec node scripts/wait-for-service.mjs scanner
      - name: Prepare test data and build
        run: |
          pnpm exec supabase migration up
          pnpm exec node --env-file=.env.local scripts/bootstrap-demo.mjs
          pnpm build
      - name: Start the optimized app
        run: |
          pnpm start --port 3200 > .tools/app.log 2>&1 &
          pnpm exec node scripts/wait-for-service.mjs app
      - run: pnpm test:e2e
      - name: Stop disposable services
        if: always()
        run: |
          docker compose -f compose.services.yaml -f compose.ci.yaml down
          pnpm exec supabase stop --no-backup
