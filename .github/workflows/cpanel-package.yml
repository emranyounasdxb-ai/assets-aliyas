name: cPanel package
on:
  workflow_dispatch:
    inputs:
      app_origin:
        description: HTTPS subdomain origin
        type: string
        default: https://assets.aliyasrealestate.ae
        required: true
      supabase_url:
        description: Production Supabase HTTPS URL
        type: string
        required: true
      supabase_publishable_key:
        description: Production public publishable key (never a secret key)
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Build cPanel package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ALIYAS_STANDALONE: "true"
      APP_ORIGIN: ${{ inputs.app_origin }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.supabase_url }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase_publishable_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require green CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&head_sha=$GITHUB_SHA" --jq '.total_count')
          test "$successful" -gt 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec node scripts/validate-deployment.mjs
      - run: pnpm build
      - run: pnpm package:cpanel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aliyas-cpanel-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
