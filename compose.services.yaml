name: aliyas-services
services:
  database:
    image: mariadb:10.11@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7
    container_name: aliyas-database
    restart: unless-stopped
    ports:
      - "127.0.0.1:56332:3306"
    environment:
      MARIADB_DATABASE: aliyas_assets
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Configure the local database password}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40
  scanner:
    image: clamav/clamav:1.5.5
    container_name: aliyas-scanner
    restart: unless-stopped
    ports:
      - "127.0.0.1:56331:3310"
    environment:
      CLAMAV_NO_MILTERD: "true"
      CLAMD_STARTUP_TIMEOUT: "600"
    volumes:
      - scanner-data:/var/lib/clamav
    mem_limit: 2g
volumes:
  database-data:
  scanner-data:
